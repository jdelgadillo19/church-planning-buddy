[package]
name = "grapevine-rig"
version = "0.1.14"
description = "Grapevine Rig — ProPresenter apply client"
authors = ["Grapevine Prep"]
edition = "2021"

[lib]
name = "grapevine_rig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native"] }
hostname = "0.4"
