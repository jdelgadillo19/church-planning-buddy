name: Grapevine Rig Release

on:
  push:
    tags:
      - "grapevine-rig-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/grapevine-rig/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install root dependencies
        run: npm ci

      - name: Build worker bundles
        run: npm run rig:prepare

      - name: Install rig app dependencies
        working-directory: apps/grapevine-rig
        run: npm ci

      - name: Tauri info (config check)
        working-directory: apps/grapevine-rig
        run: npx tauri info

      - name: Build Tauri .dmg
        working-directory: apps/grapevine-rig
        env:
          CI: true
        run: npx tauri build

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          DMG=$(find apps/grapevine-rig/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "No .dmg found under src-tauri/target/release/bundle/dmg"
            find apps/grapevine-rig/src-tauri/target -name '*.dmg' || true
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#grapevine-rig-v}"
          cp "$DMG" "release-assets/Grapevine-Rig-${VERSION}-macos.dmg"
          ls -lh release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
