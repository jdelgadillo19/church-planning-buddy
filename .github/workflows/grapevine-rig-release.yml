name: Grapevine Rig Release

on:
  push:
    tags:
      - "grapevine-rig-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/grapevine-rig/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install root dependencies
        run: npm ci

      - name: Build worker bundles
        run: npm run rig:prepare

      - name: Verify bundle inputs
        run: |
          test -f apps/grapevine-rig/src-tauri/resources/worker.mjs
          test -f apps/grapevine-rig/src-tauri/resources/scan.mjs
          test -f apps/grapevine-rig/src-tauri/resources/export-playlist.applescript
          test -f apps/grapevine-rig/frontend/index.html

      - name: Install rig app dependencies
        working-directory: apps/grapevine-rig
        run: npm ci

      - name: Build Tauri .dmg
        id: tauri_build
        working-directory: apps/grapevine-rig
        env:
          CI: true
        run: |
          set -o pipefail
          npx tauri build --target universal-apple-darwin --verbose 2>&1 | tee ../../tauri-build.log

      - name: Upload build log on failure
        if: failure() && steps.tauri_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log-macos
          path: tauri-build.log

      - name: Collect macOS asset
        run: |
          mkdir -p release-assets
          DMG=$(find apps/grapevine-rig/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "No .dmg found under universal-apple-darwin release bundle/dmg"
            find apps/grapevine-rig/src-tauri/target -name '*.dmg' || true
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#grapevine-rig-v}"
          cp "$DMG" "release-assets/Grapevine-Rig-${VERSION}-macos.dmg"
          ls -lh release-assets/

      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: rig-macos-dmg
          path: release-assets/*.dmg

  build-windows-nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/grapevine-rig/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install root dependencies
        run: npm ci

      - name: Build worker bundles
        run: npm run rig:prepare

      - name: Install rig app dependencies
        working-directory: apps/grapevine-rig
        run: npm ci

      - name: Build Tauri Windows installer
        working-directory: apps/grapevine-rig
        env:
          CI: true
        run: npx tauri build --bundles nsis

      - name: Collect Windows asset
        shell: bash
        run: |
          mkdir -p release-assets
          EXE=$(find apps/grapevine-rig/src-tauri/target/release/bundle/nsis -name '*.exe' | head -1)
          if [ -z "$EXE" ]; then
            find apps/grapevine-rig/src-tauri/target -name '*.exe' || true
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#grapevine-rig-v}"
          cp "$EXE" "release-assets/Grapevine-Rig-${VERSION}-windows-setup.exe"
          ls -lh release-assets/

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: rig-windows-exe
          path: release-assets/*.exe

  publish-release:
    needs: [build-macos-dmg, build-windows-nsis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: rig-macos-dmg
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: rig-windows-exe
          path: release-assets

      - name: List release assets
        run: ls -lh release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true

      - name: Upload installers to R2 (permanent download URL)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Skipping R2 upload — CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set."
            exit 0
          fi
          npm ci
          DMG=$(find release-assets -name '*.dmg' | head -1)
          EXE=$(find release-assets -name '*.exe' | head -1)
          if [ -n "$DMG" ]; then
            npx wrangler r2 object put grapevine-rig-downloads/grapevine-rig-macos.dmg \
              --remote \
              --file="$DMG" \
              --content-type=application/x-apple-diskimage
          fi
          if [ -n "$EXE" ]; then
            npx wrangler r2 object put grapevine-rig-downloads/grapevine-rig-windows-setup.exe \
              --remote \
              --file="$EXE" \
              --content-type=application/octet-stream
          fi
