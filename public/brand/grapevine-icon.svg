    </linearGradient>
    <radialGradient id="tileLight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 180) rotate(50) scale(760 620)">
      <stop offset="0" stop-color="#4ac29f" stop-opacity=".46"/>
      <stop offset=".42" stop-color="#4ac29f" stop-opacity=".13"/>
      <stop offset="1" stop-color="#4ac29f" stop-opacity="0"/>
